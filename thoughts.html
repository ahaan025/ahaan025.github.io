<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thoughts · Ahaan Mehta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Page overrides */
body { font-size: 14.5px; }
.container { padding-bottom: 120px; }

/* INTRO — matches research page */
.intro {
  text-align: center;
  margin: 130px auto 0;
  max-width: 560px;
}
.intro p {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.5;
  color: var(--text-2);
  letter-spacing: 0.1px;
}
.intro p + p {
  margin-top: 14px;
  color: var(--warm-text);
  font-size: 17px;
}

.intro-divider {
  width: 36px;
  height: 1px;
  background: var(--warm-rule-2);
  margin: 80px auto 0;
}

/* LOG INDEX */
.log-index { margin-top: 72px; }
.section-label {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--warm-label);
  text-transform: uppercase;
  margin-bottom: 28px;
}
.log-list { list-style: none; }
.log-list li {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 9px 0;
}
.log-list .title {
  font-family: var(--serif);
  font-size: 16.5px;
  color: var(--text-1);
  text-decoration: none;
  transition: color 0.15s ease;
}
.log-list .leader {
  flex: 1;
  border-bottom: 1px dotted var(--warm-dot);
  transform: translateY(-4px);
  min-width: 24px;
}
.log-list .date {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--warm-date);
  white-space: nowrap;
  flex-shrink: 0;
}
.log-list li:hover .title { color: var(--text); }
.log-list li:hover .leader { border-bottom-color: var(--warm-hover); }

/* RESPONSIVE */
@media (max-width: 640px) {
  .intro { margin-top: 80px; }
  .log-list .title { font-size: 15px; }
}
</style>
</head>
<body>
<div class="container">


  <!-- TOP BAR -->
  <div class="topbar">
    <nav>
      <a href="index.html" class="monogram" aria-label="Ahaan Mehta, home"><span class="slash">/</span><span class="mark">am</span></a>
      <div class="nav-links">
        <a href="research.html">Papers</a>
        <a href="projects.html">Projects</a>
        <a href="thoughts.html" class="active">Thoughts</a>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch between light and dark"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.4 8.4 0 019.8 3.5a8.5 8.5 0 1010.7 10.7z"/></svg></button>
    </nav>
    <div class="clocks" aria-label="Local time in San Francisco and Providence"></div>
  </div>

<!-- INTRO -->
  <section class="intro">
    <p>Writing on whatever I'm building, reading, or puzzling over.</p>
    <p>Published occasionally, in reverse chronological order.</p>
  </section>

  <div class="intro-divider"></div>

  <!-- LOG INDEX -->
  <!-- ════════════════════════════════════════════════════
       TO PUBLISH AN ENTRY:
       1. Copy thoughts/post-template.html to thoughts/your-slug.html
       2. Write your post in it (title, date, body)
       3. Add one <li> below, newest at the top:

       <li>
         <a class="title" href="thoughts/your-slug.html">Your Title</a>
         <span class="leader"></span>
         <span class="date">Aug 2026</span>
       </li>
       ════════════════════════════════════════════════════ -->
  <section class="log-index">
    <div class="section-label">All Entries</div>
    <ul class="log-list">
      <li>
        <a class="title" href="thoughts/two-maps-and-a-sign-out-bug.html">Summer at Dex (YC S19)</a>
        <span class="leader"></span>
        <span class="date">Aug 2026</span>
      </li>
    </ul>
  </section>

</div>
<script src="site.js"></script>
</body>
</html>
