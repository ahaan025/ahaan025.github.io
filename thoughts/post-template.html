<title>Post Title · Ahaan Mehta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
/* POST */
.post {
  max-width: 620px;
  margin: 90px auto 0;
}
.back-link {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--warm-date);
  text-decoration: none;
  transition: color 0.15s;
}
.back-link:hover { color: var(--text-1); }

.post-date {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--warm-label);
  margin: 48px 0 14px;
}
.post h1 {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.2px;
  color: var(--text-1);
  margin-bottom: 36px;
}

.post-body p {
  font-family: var(--serif);
  font-size: 17.5px;
  line-height: 1.72;
  color: var(--warm-ink);
  letter-spacing: 0.05px;
  margin-bottom: 22px;
}
.post-body h2 {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 500;
  color: var(--text-1);
  margin: 40px 0 14px;
}
.post-body a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid var(--warm-rule);
  transition: border-color 0.15s;
}
.post-body a:hover { border-bottom-color: var(--text); }
.post-body em { font-style: italic; }
.post-body blockquote {
  border-left: 2px solid var(--warm-rule-2);
  padding-left: 20px;
  margin: 28px 0;
  color: var(--warm-text);
  font-style: italic;
}
.post-body code {
  font-family: var(--mono);
  font-size: 14px;
  background: var(--warm-bg);
  padding: 1px 5px;
  border-radius: 3px;
}
.post-body ul, .post-body ol {
  font-family: var(--serif);
  font-size: 17.5px;
  line-height: 1.72;
  color: var(--warm-ink);
  margin: 0 0 22px 24px;
}

.post-end {
  width: 36px;
  height: 1px;
  background: var(--warm-rule-2);
  margin: 56px 0 0;
}

/* RESPONSIVE */
@media (max-width: 640px) {
  .post { margin-top: 56px; }
  .post h1 { font-size: 25px; }
  .post-body p, .post-body ul, .post-body ol { font-size: 16.5px; }
}
</style>
</head>
<body>
<div class="container">


  <!-- TOP BAR -->
  <div class="topbar">
    <nav>
      <button type="button" class="monogram" data-theme-toggle aria-label="Switch between light and dark"><span class="slash pre">/</span><span class="mark">am</span><span class="slash post">/</span></button>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../research.html">Research</a>
        <a href="../projects.html">Projects</a>
        <a href="../thoughts.html" class="active">Thoughts</a>
      </div>
    </nav>
    <div class="clocks" aria-label="Local time in Bangalore and Providence"></div>
  </div>

<!-- POST -->
  <article class="post">
    <a class="back-link" href="../thoughts.html">← All entries</a>

    <div class="post-date">August 12, 2026</div>
    <h1>Post Title Goes Here</h1>

        <li>Lists work too</li>
        <li>Like this</li>

    </div>

    <div class="post-end"></div>
  </article>

</div>
<script src="../site.js"></script>
</body>
</html>
